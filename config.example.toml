# Copy to config.toml and adjust for your machine.
# Env vars override every value: LC_VAULT_DIR, LC_NOTES_DIR, LC_REPO_DIR, LC_VAULT_NAME.

[vault]
# Root of the Obsidian vault, and the folder inside it that holds problem notes.
dir        = "~/Library/Mobile Documents/iCloud~md~obsidian/Documents/YourVault"
notes_dir  = "Learnings/Leetcode"
# Vault name as Obsidian knows it, used to build obsidian:// URIs.
name       = "YourVault"

[repo]
dir    = "~/leetcode"
remote = "git@github.com:you/leetcode.git"
branch = "main"

[sync]
# Only notes with one of these statuses are pushed to the repo.
publish_statuses = ["solved", "review"]

[review]
# Spaced-repetition ladder, in days. Index = number of times solved.
# Harder problems come back sooner.
easy   = [3, 10, 30, 90]
medium = [2, 7, 21, 60]
hard   = [1, 4, 14, 45]
