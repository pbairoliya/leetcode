name: tests

# The suite is entirely offline — no network, no fixtures fetched at runtime,
# no macOS-only calls — so it runs on a plain Ubuntu box in a couple of seconds.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # 3.11+ for tomllib
      - run: pip install pytest
      - run: python -m pytest tools/tests -q
